name: E2E Tests — Wedding Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project:
          - { name: chromium, browser: chromium }
          - { name: firefox, browser: firefox }
          - { name: webkit, browser: webkit }
          - { name: mobile-chrome, browser: chromium }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.project.browser }}

      - name: Run E2E tests (${{ matrix.project.name }})
        run: npx playwright test --project=${{ matrix.project.name }}
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://rezashila2026.vercel.app' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project.name }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts (traces, videos, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.project.name }}
          path: |
            test-results/
            !test-results/*.json
          retention-days: 30

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ matrix.project.name }}
          path: test-results/junit.xml
          retention-days: 30
